name: Format portability fix

on:
  push:
    branches: [fix/real-world-vela-regressions]

permissions:
  contents: write

jobs:
  black:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-world-vela-regressions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'black==26.10.1'
      - run: black vela/static.py
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vela/static.py
          git commit -m 'style: format portability fix'
          git push origin HEAD:fix/real-world-vela-regressions
