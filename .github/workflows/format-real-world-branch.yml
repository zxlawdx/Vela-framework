name: Format real-world regression branch

on:
  push:
    branches: [fix/real-world-vela-regressions]

permissions:
  contents: write

jobs:
  black:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-world-vela-regressions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'black>=23'
      - name: Format changed Python files
        run: |
          git diff --name-only --diff-filter=ACMRT origin/main...HEAD -- '*.py' > /tmp/vela-python-files.txt
          if [ -s /tmp/vela-python-files.txt ]; then
            xargs -a /tmp/vela-python-files.txt black
          fi
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.py'
          git commit -m 'style: apply black to real-world regression changes'
          git push origin HEAD:fix/real-world-vela-regressions
