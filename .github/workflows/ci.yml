name: Vela CI and Linux build smoke

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install framework
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile Python
        run: python -m compileall -q vela tests
      - name: Run tests
        run: python -m unittest discover -s tests -v

  linux-build-smoke:
    needs: tests
    runs-on: ubuntu-22.04
    env:
      QT_API: pyqt6
      PYWEBVIEW_GUI: qt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libnss3 libgbm1 \
            libdbus-1-3 libasound2 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0 libxcb-shape0 libgl1-mesa-dri zip
      - name: Install Vela with build tools
        run: python -m pip install -e ".[qt6,build]"
      - name: Create sample Vela app
        run: vela startproject smokeapp
      - name: Verify virtualenv detection with real Linux interpreters
        run: |
          python -m venv /tmp/vela-isolated
          python -m venv --system-site-packages /tmp/vela-shared
          /tmp/vela-isolated/bin/python -c "from vela.cli.build import linux_venv_info; x=linux_venv_info(); assert x['active'] and not x['system_site_packages'], x"
          /tmp/vela-shared/bin/python -c "from vela.cli.build import linux_venv_info; x=linux_venv_info(); assert x['active'] and x['system_site_packages'], x"
      - name: Build Linux app with Vela
        run: |
          cd smokeapp
          # Reproduz o runtime hook pyi_rth_pkgres que anteriormente
          # falhava ao carregar jaraco no executavel do ZTE Automatic.
          python -c "import pkg_resources, jaraco.text, jaraco.functools, jaraco.context, more_itertools; print('legacy imports OK')"
          printf '\nimport pkg_resources  # regression test for pyi_rth_pkgres\n' >> config/wsgi.py
          python manage.py doctor --gui qt6
          python manage.py buildapp --gui qt6 --installer
          test -f dist/Meu-App-Vela/Meu-App-Vela
          ./dist/Meu-App-Vela/Meu-App-Vela --self-test
          test -f dist/Meu-App-Vela/Instalar.sh
          test -n "$(find dist -maxdepth 1 -name '*.zip' -print -quit)"

  package-smoke:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import glob, tarfile, zipfile
          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == len(sdists) == 1, (wheels, sdists)
          with zipfile.ZipFile(wheels[0]) as z:
              names = z.namelist()
              assert any(x.endswith("/licenses/LICENSE") for x in names), names
              assert any(x.endswith("/licenses/NOTICE.md") for x in names), names
              assert "vela/core/shell.html" in names, names
              assert "vela/templates/project/config/settings.py" in names, names
              assert "vela/templates/project/apps/home/templates/home.html" in names, names
              meta = next(x for x in names if x.endswith(".dist-info/METADATA"))
              assert b"License-Expression: MPL-2.0" in z.read(meta)
          with tarfile.open(sdists[0], "r:gz") as t:
              names = t.getnames()
              assert any(x.endswith("/LICENSE") for x in names)
              assert any(x.endswith("/CITATION.cff") for x in names)
          PY
      - name: Install wheel in a clean external venv
        run: |
          TMP="$(mktemp -d)"
          python -m venv "$TMP/venv"
          "$TMP/venv/bin/python" -m pip install dist/*.whl
          cd "$TMP"
          ./venv/bin/vela startproject example
          test -f example/config/settings.py
          test -f example/apps/home/templates/home.html
          ./venv/bin/python -c "import vela; assert vela.__version__ == '0.2.2'"
          cd example
          ../venv/bin/python manage.py help | grep -F "init-process:instalation"
      - uses: actions/upload-artifact@v4
        with:
          name: vela-pypi-packages
          path: dist/*
          retention-days: 14
