name: Vela CI and cross-platform regression smoke

on:
  push:
    branches: [main, "feature/**", "fix/**", "refactor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: "22"
      - name: Install framework and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q vela tests benchmarks
      - name: Run pytest suite
        run: python -m pytest -q
      - name: Real Windows Node launcher regression
        if: runner.os == 'Windows'
        run: >-
          python -c "from vela.cli.tools import resolve_node_tool; import subprocess;
          p=resolve_node_tool('npx'); print('resolved npx:', p);
          assert p and p.lower().endswith(('.cmd','.exe','.bat')), p;
          subprocess.run([p, '--version'], check=True, shell=False)"
      - name: Real Windows collectstatic smoke
        if: runner.os == 'Windows'
        run: >-
          python -c "import os,tempfile; from pathlib import Path;
          from vela.cli.collectstatic import collect_static;
          root=Path(tempfile.mkdtemp()); source=root/'apps'/'demo'/'static';
          source.mkdir(parents=True); (source/'app.js').write_text('ok', encoding='utf-8');
          os.chdir(root); result=collect_static(skip_tailwind=True, verbose=False);
          assert result['errors']==0, result;
          assert (root/'staticfiles'/'demo'/'app.js').is_file();
          assert (root/'staticfiles'/'manifest.json').is_file()"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: python -m pip install "ruff>=0.1" "black>=23"
      - name: Select changed Python files
        run: git diff --name-only --diff-filter=ACMRT origin/main...HEAD -- '*.py' > /tmp/vela-python-files.txt
      - name: Ruff
        run: |
          if [ -s /tmp/vela-python-files.txt ]; then
            xargs -a /tmp/vela-python-files.txt ruff check
          fi
      - name: Black check
        run: |
          if [ -s /tmp/vela-python-files.txt ]; then
            xargs -a /tmp/vela-python-files.txt black --diff --check
          fi

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pip-audit>=2.7"
      - name: Audit installed dependencies
        run: pip-audit --local --skip-editable

  benchmark-smoke:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install framework
        run: python -m pip install -e .
      - name: Run core benchmark suite
        run: python benchmarks/bench_core.py

  linux-build-smoke:
    needs: tests
    runs-on: ubuntu-22.04
    env:
      QT_API: pyqt6
      PYWEBVIEW_GUI: qt
      VELA_GUI: qt6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libnss3 libgbm1 \
            libdbus-1-3 libasound2 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0 libxcb-shape0 libgl1-mesa-dri zip
      - name: Install Vela with build tools
        run: python -m pip install -e ".[qt6,build]"
      - name: Create sample Vela app
        run: vela startproject smokeapp
      - name: Verify virtualenv detection with real Linux interpreters
        run: |
          python -m venv /tmp/vela-isolated
          python -m venv --system-site-packages /tmp/vela-shared
          /tmp/vela-isolated/bin/python -c "from vela.cli.build import linux_venv_info; x=linux_venv_info(); assert x['active'] and not x['system_site_packages'], x"
          /tmp/vela-shared/bin/python -c "from vela.cli.build import linux_venv_info; x=linux_venv_info(); assert x['active'] and x['system_site_packages'], x"
      - name: Verify project assets and runtime self-test
        run: |
          cd smokeapp
          python manage.py collectstatic --no-tailwind
          python manage.py assets verify
          python manage.py self-test
      - name: Build Linux app with Vela
        run: |
          cd smokeapp
          python -c "import pkg_resources, jaraco.text, jaraco.functools, jaraco.context, more_itertools; print('legacy imports OK')"
          printf '\nimport pkg_resources  # regression test for pyi_rth_pkgres\n' >> config/wsgi.py
          python manage.py doctor --gui qt6
          python manage.py buildapp --gui qt6 --installer
          test -f dist/build-report.json
          test -f dist/Meu-App-Vela/Meu-App-Vela
          ./dist/Meu-App-Vela/Meu-App-Vela --self-test
          test -f dist/Meu-App-Vela/Instalar.sh
          test -n "$(find dist -maxdepth 1 -name '*.zip' -print -quit)"

  package-smoke:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import glob, tarfile, zipfile
          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == len(sdists) == 1, (wheels, sdists)
          with zipfile.ZipFile(wheels[0]) as z:
              names = z.namelist()
              assert any(x.endswith("/licenses/LICENSE") for x in names), names
              assert any(x.endswith("/licenses/NOTICE.md") for x in names), names
              assert "vela/core/shell.html" in names, names
              assert "vela/templates/project/config/settings.py" in names, names
              assert "vela/templates/project/apps/home/templates/home.html" in names, names
              meta = next(x for x in names if x.endswith(".dist-info/METADATA"))
              assert b"License-Expression: MPL-2.0" in z.read(meta)
          with tarfile.open(sdists[0], "r:gz") as t:
              names = t.getnames()
              assert any(x.endswith("/LICENSE") for x in names)
              assert any(x.endswith("/CITATION.cff") for x in names)
          PY
      - name: Install wheel in a clean external venv
        run: |
          TMP="$(mktemp -d)"
          python -m venv "$TMP/venv"
          "$TMP/venv/bin/python" -m pip install dist/*.whl
          cd "$TMP"
          ./venv/bin/vela startproject example
          test -f example/config/settings.py
          test -f example/apps/home/templates/home.html
          ./venv/bin/python -c "import vela; assert vela.__version__ == '0.2.2'; from vela import VelaApp"
          cd example
          ../venv/bin/python manage.py help | grep -F "init-process:instalation"
      - uses: actions/upload-artifact@v4
        with:
          name: vela-pypi-packages
          path: dist/*
          retention-days: 14
