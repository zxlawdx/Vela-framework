[project]
name = "vela-framework"
version = "0.2.2"
description = "Framework Python para aplicações desktop com HTML, CSS, Tailwind e JS — sem navegador"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Marinaldo da Costa Barroso Filho"}]
maintainers = [{name = "Marinaldo da Costa Barroso Filho"}]
keywords = ["desktop", "framework", "pywebview", "html", "css", "javascript", "gui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"

dependencies = [
    "pywebview==6.2.1",
    "bottle==0.13.4",
    "waitress>=3.0,<4",
    "proxy_tools==0.1.0",
    "typing_extensions==4.15.0",
]

[project.optional-dependencies]
linux = [
    "pycairo>=1.20.0",
    "PyGObject>=3.42.0",
]
qt6 = ["PyQt6>=6.8,<7", "PyQt6-WebEngine>=6.8,<7", "qtpy>=2.4,<3"]
build = [
    "pyinstaller>=6.16,<7",
    "setuptools>=77,<82",
    "jaraco.text>=3.12",
    "jaraco.functools>=4",
    "jaraco.context>=5",
    "more-itertools>=10",
]
notifications = ["win10toast>=0.9; platform_system == 'Windows'"]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/zxlawdx/Vela-framework"
Repository = "https://github.com/zxlawdx/Vela-framework"
Documentation = "https://github.com/zxlawdx/Vela-framework/tree/main/docs"
Issues = "https://github.com/zxlawdx/Vela-framework/issues"
Changelog = "https://github.com/zxlawdx/Vela-framework/blob/main/CHANGELOG.md"

[project.scripts]
vela = "vela.cli.main:main"

[tool.setuptools.packages.find]
include = ["vela*"]
exclude = ["logs*"]

[tool.setuptools.package-data]
vela = [
    "templates/project/**/*",
    "templates/project/**/.gitkeep",
    "core/shell.html",
    "docs/static/**/*",
]

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
