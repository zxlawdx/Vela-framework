[project]
name = "vela-framework"
version = "0.2.1"
description = "Framework Python para aplicações desktop com HTML, CSS, Tailwind e JS — sem navegador"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Marinaldo da Costa Barroso Filho"}]
maintainers = [{name = "Marinaldo da Costa Barroso Filho"}]
keywords = ["desktop", "framework", "pywebview", "html", "css", "javascript", "gui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

requires-python = ">=3.10"

# ─── Dependências instaladas automaticamente pelo pip ────────────────────────
#
# Ao rodar:
#   pip install -e .           (desenvolvimento local)
#   pip install vela-framework (futuro PyPI)
#   pip install git+https://github.com/...
#
# O pip instala todas as dependências abaixo automaticamente.
# Não é necessário rodar `pip install -r requirements.txt` separadamente.
#
dependencies = [
    # Janela desktop nativa (GTK/WebKit no Linux, WebView2 no Windows, WKWebView no macOS)
    "pywebview==6.2.1",

    # Servidor HTTP interno usado pelo Vela para servir assets locais
    "bottle==0.13.4",
    "waitress>=3.0,<4",

    # Utilitário de proxy para funções Python expostas ao JS
    "proxy_tools==0.1.0",

    # Extensões de tipagem para compatibilidade com Python 3.10+
    "typing_extensions==4.15.0",
]

# ─── Dependências opcionais ───────────────────────────────────────────────────
#
# Instaladas sob demanda:
#   pip install "vela-framework[linux]"      → dependências GTK/WebKit2 do Linux
#   pip install "vela-framework[dev]"        → ferramentas de desenvolvimento
#
[project.optional-dependencies]

# Nota: no Linux, pycairo e PyGObject são melhor instalados via apt:
#   sudo apt install python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1
# Mas para ambientes que permitam pip puro (CI, Docker), listamos aqui também.
linux = [
    "pycairo>=1.20.0",
    "PyGObject>=3.42.0",
]

qt6 = ["PyQt6>=6.8,<7", "PyQt6-WebEngine>=6.8,<7", "qtpy>=2.4,<3"]

build = ["pyinstaller>=6.16,<7"]

notifications = ["win10toast>=0.9; platform_system == 'Windows'"]

dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

# ─── CLI global ───────────────────────────────────────────────────────────────
#
# Após instalar via pip ou pipx, o comando `vela` fica disponível globalmente:
#   vela startproject meu_app
#
[project.urls]
Homepage = "https://github.com/zxlawdx/Vela-framework"
Repository = "https://github.com/zxlawdx/Vela-framework"
Documentation = "https://github.com/zxlawdx/Vela-framework/tree/main/docs"
Issues = "https://github.com/zxlawdx/Vela-framework/issues"
Changelog = "https://github.com/zxlawdx/Vela-framework/blob/main/CHANGELOG.md"

[project.scripts]
vela = "vela.cli.main:main"

# ─── Configuração do setuptools ───────────────────────────────────────────────

[tool.setuptools.packages.find]
# Inclui o pacote vela e todos os subpacotes automaticamente
include = ["vela*"]
# Exclui a pasta de logs gerada em runtime
exclude = ["logs*"]

[tool.setuptools.package-data]
# Inclui templates de projeto, shell.html e arquivos não-Python
vela = [
    "templates/project/**/*",
    "templates/project/**/.gitkeep",
    "core/shell.html",
]

# ─── Build system ─────────────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

# ─── Ferramentas ──────────────────────────────────────────────────────────────

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]
ignore = ["E501"]
