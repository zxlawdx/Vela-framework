<!DOCTYPE html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vela App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: {
        sans: ['Inter', 'system-ui', 'sans-serif'],
        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
      }}}
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { -webkit-user-select: none; user-select: none; }
    input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
    html, body { overflow: hidden; height: 100%; width: 100%; margin: 0; background: transparent; }
    #vela-root, #vela-main, #vela-page { background: transparent; }
    #vela-page { transition: opacity .12s ease, transform .12s ease; }
    #vela-page.vela-transition-out { opacity: 0; transform: translateY(4px); }
    .vela-layout-blank #vela-sidebar, .vela-layout-blank #vela-topbar { display: none !important; }
    .vela-layout-blank #vela-main { width: 100vw; }
    @keyframes vela-spin { to { transform: rotate(360deg); } }
    .vela-spinner { animation: vela-spin .7s linear infinite; }
  </style>
</head>
<body id="vela-body" class="font-sans antialiased">
  <div id="vela-root" class="h-screen w-screen flex overflow-hidden">
    <div id="vela-sidebar"></div>
    <div id="vela-main" class="flex-1 flex flex-col overflow-hidden min-w-0">
      <div id="vela-topbar"></div>
      <main id="vela-page" class="flex-1 overflow-auto"></main>
    </div>
  </div>
  <div id="vela-toast" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50 pointer-events-none"></div>
  <div id="vela-loading" class="hidden fixed inset-0 bg-black/40 items-center justify-center z-50">
    <div class="vela-spinner w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full"></div>
  </div>

  <script>
    const Vela = {
      currentPath: null,
      sidebarRoutes: [],
      config: {},
      _initialized: false,

      async init() {
        if (this._initialized) return
        this._initialized = true
        try {
          this.config = await window.pywebview.api.get_config()
          await this.loadRoutes()
          this.setupLayout()
          const params = new URLSearchParams(window.location.search)
          const entry = params.get('entry') || window.__VELA_ENTRY__ || '/'
          await this.navigate(entry)
        } catch (err) {
          console.error('[Vela] Erro no init:', err)
          this.toast('Falha ao inicializar o app.', 'error')
        }
      },

      setupLayout() {
        const layout = this.config.layout || {}
        if (layout.sidebar !== false) this.renderSidebar()
        else document.getElementById('vela-sidebar')?.remove()
        if (layout.topbar !== false) this.renderTopbar()
        else document.getElementById('vela-topbar')?.remove()
        this.bindPageLinks(document.getElementById('vela-page'))
      },

      async navigate(path, params = {}) {
        const previousPage = window.VelaPage
        if (previousPage?.beforeUnmount) {
          try { previousPage.beforeUnmount() } catch (err) {
            console.error('[Vela] Erro em VelaPage.beforeUnmount():', err)
          }
        }
        this.showLoading()
        try {
          const result = await window.pywebview.api.navigate(path, JSON.stringify(params))
          const page = document.getElementById('vela-page')
          page.classList.add('vela-transition-out')
          await this._sleep(120)
          window.VelaPage = null
          page.innerHTML = result.html || ''
          if (previousPage?.unmounted) {
            try { previousPage.unmounted() } catch (err) {
              console.error('[Vela] Erro em VelaPage.unmounted():', err)
            }
          }
          page.classList.remove('vela-transition-out')
          this.currentPath = path
          this.applyRouteLayout(result.layout)
          this.updateSidebarActive(path)
          this.updateTopbarTitle(path)

          // Scripts pertencem ao template da aplicação (trusted application code).
          // Valores de contexto são autoescapados no Python; somente SafeHTML pode
          // inserir HTML cru. Páginas de erro/404 nunca executam scripts.
          if (result.ok) {
            this.executeInlineScripts(page)
            if (window.VelaPage?.mounted) {
              try { window.VelaPage.mounted() } catch (err) {
                console.error('[Vela] Erro em VelaPage.mounted():', err)
              }
            }
          } else {
            this.toast(`Falha ao carregar página (${result.status || 'erro'}).`, 'error')
          }

          document.dispatchEvent(new CustomEvent('vela:navigate', {
            detail: { path, layout: result.layout, status: result.status, ok: result.ok }
          }))
        } catch (err) {
          console.error('[Vela] Erro ao navegar:', err)
          this.toast('Erro ao navegar.', 'error')
        } finally {
          this.hideLoading()
        }
      },

      applyRouteLayout(layout) {
        const root = document.getElementById('vela-root')
        root.classList.remove('vela-layout-blank', 'vela-layout-default')
        root.classList.add(layout === 'blank' ? 'vela-layout-blank' : 'vela-layout-default')
      },

      async loadRoutes() {
        try { this.sidebarRoutes = await window.pywebview.api.get_routes() }
        catch (err) { console.error('[Vela] Erro ao carregar rotas:', err); this.sidebarRoutes = [] }
      },

      renderSidebar() {
        const host = document.getElementById('vela-sidebar')
        if (!host) return
        host.replaceChildren()
        const aside = document.createElement('aside')
        aside.className = 'w-60 h-screen bg-zinc-900 border-r border-zinc-800/60 flex flex-col p-4 gap-1 flex-shrink-0'
        const brand = document.createElement('div')
        brand.className = 'mb-6 px-1 flex items-center gap-2'
        const mark = document.createElement('div')
        mark.className = 'w-6 h-6 bg-blue-500 rounded-md flex items-center justify-center'
        mark.textContent = 'V'
        const title = document.createElement('span')
        title.className = 'text-sm font-bold tracking-tight text-white'
        title.textContent = String(this.config.title || 'Vela')
        brand.append(mark, title)
        const nav = document.createElement('nav')
        nav.className = 'flex flex-col gap-0.5 flex-1'
        for (const route of this.sidebarRoutes) {
          const button = document.createElement('button')
          button.dataset.velaRoute = String(route.path)
          button.dataset.velaLink = ''
          button.className = 'vela-nav-item w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2.5 text-zinc-400 hover:text-white hover:bg-zinc-800'
          if (route.icon) {
            const icon = document.createElement('span')
            icon.className = 'text-base leading-none'
            icon.textContent = String(route.icon)
            button.append(icon)
          }
          const label = document.createElement('span')
          label.textContent = String(route.title || '')
          button.append(label)
          nav.append(button)
        }
        if (!this.sidebarRoutes.length) {
          const empty = document.createElement('p')
          empty.className = 'text-xs text-zinc-600 px-2'
          empty.textContent = 'Nenhuma rota registrada.'
          nav.append(empty)
        }
        aside.append(brand, nav)
        host.append(aside)
      },

      renderTopbar() {
        const topbar = document.getElementById('vela-topbar')
        if (!topbar) return
        topbar.replaceChildren()
        const header = document.createElement('header')
        header.className = 'h-12 bg-zinc-900/50 border-b border-zinc-800/60 flex items-center px-5 gap-3 flex-shrink-0'
        const title = document.createElement('span')
        title.id = 'vela-topbar-title'
        title.className = 'text-sm font-semibold text-zinc-200'
        const marker = document.createElement('span')
        marker.className = 'ml-auto text-xs text-zinc-600 font-mono'
        marker.textContent = 'vela'
        header.append(title, marker)
        topbar.append(header)
      },

      updateSidebarActive(path) {
        document.querySelectorAll('[data-vela-route]').forEach(el => {
          const active = el.dataset.velaRoute === path
          el.classList.toggle('active', active)
          el.classList.toggle('text-zinc-400', !active)
        })
      },

      updateTopbarTitle(path) {
        const el = document.getElementById('vela-topbar-title')
        if (!el) return
        const route = this.sidebarRoutes.find(item => item.path === path)
        el.textContent = route?.title || ''
      },

      executeInlineScripts(container) {
        container.querySelectorAll('script').forEach(oldScript => {
          const newScript = document.createElement('script')
          Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value))
          if (oldScript.textContent) newScript.textContent = oldScript.textContent
          document.body.appendChild(newScript)
          oldScript.remove()
        })
      },

      bindPageLinks(container) {
        if (!container || container.dataset.velaLinksBound === '1') return
        container.dataset.velaLinksBound = '1'
        container.addEventListener('click', event => {
          const link = event.target.closest('[data-vela-link]')
          if (!link) return
          event.preventDefault()
          const path = link.getAttribute('href') || link.dataset.velaRoute
          if (path) Vela.navigate(path)
        })
      },

      toast(message, type = 'info', duration = 3500) {
        const styles = {
          info: 'bg-zinc-800 text-zinc-200 border-zinc-700',
          success: 'bg-green-950 text-green-200 border-green-800',
          error: 'bg-red-950 text-red-200 border-red-800',
          warning: 'bg-yellow-950 text-yellow-200 border-yellow-800',
        }
        const container = document.getElementById('vela-toast')
        const el = document.createElement('div')
        el.className = `pointer-events-auto px-4 py-3 rounded-xl text-sm shadow-xl border ${styles[type] || styles.info}`
        el.textContent = String(message)
        container.appendChild(el)
        setTimeout(() => { el.style.transition = 'opacity .3s ease'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300) }, duration)
      },

      showLoading() { const el = document.getElementById('vela-loading'); el.classList.remove('hidden'); el.classList.add('flex') },
      hideLoading() { const el = document.getElementById('vela-loading'); el.classList.add('hidden'); el.classList.remove('flex') },
      _sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)) },
    }

    document.addEventListener('click', event => {
      const link = event.target.closest('[data-vela-link]')
      if (!link) return
      const page = document.getElementById('vela-page')
      if (page && page.contains(link)) return
      event.preventDefault()
      const path = link.getAttribute('href') || link.dataset.velaRoute
      if (path) Vela.navigate(path)
    })

    function _velaBootstrap() {
      if (window.pywebview?.api) Vela.init()
      else setTimeout(_velaBootstrap, 50)
    }
    window.addEventListener('pywebviewready', () => Vela.init())
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { if (!Vela._initialized) _velaBootstrap() }, 300)
    })
  </script>
</body>
</html>
